name: Release

# Pushing a tag like v1.0.0 creates the GitHub Release with generated notes.
#   git tag -a v1.0.0 -m "Leaderboard API 1.0.0" && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Write release header
        run: |
          cat > release-header.md <<NOTES
          ## Leaderboard REST API ${GITHUB_REF_NAME}

          \`\`\`bash
          git clone ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git && cd $(basename "${GITHUB_REPOSITORY}")
          git checkout ${GITHUB_REF_NAME}
          docker compose up -d --wait   # → http://localhost:8080/swagger
          \`\`\`

          - Documentation: https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "${GITHUB_REPOSITORY}")/
          - Architecture decisions: [docs/adr](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/docs/adr)
          - Performance report: [docs/performance.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/performance.md)

          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Leaderboard API ${GITHUB_REF_NAME}" \
            --notes-file release-header.md --generate-notes ${prerelease}
